<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - Veterinary Clinic</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="login-layout">
    <div class="login-card">
        <h1>Iniciar sesión</h1>
        <p class="page-description">Ingresa tus credenciales para abrir tu panel de administración, veterinario o recepcionista.</p>

        <form method="post" action="/login" class="form-panel">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" placeholder="Nombre de usuario" required />

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" required />

            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="login-footer">
            <p>Credenciales de ejemplo:</p>
            <ul>
                <li><strong>admin / admin123</strong> - Administrador</li>
                <li><strong>recepcionista / recepcion123</strong> - Recepcionista</li>
                <li><strong>veterinario / veterinario123</strong> - Veterinario</li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
