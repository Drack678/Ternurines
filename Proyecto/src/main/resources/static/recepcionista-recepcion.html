<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recepción - Recepcionista</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="recepcionista-recepcion">
    <div class="action-layout">
        <div class="action-frame">
            <div class="page-header">
                <div>
                    <h1>Recepción</h1>
                    <p class="page-description">Registra la llegada de los pacientes, confirma citas y atiende a los clientes en recepción.</p>
                </div>
                <div class="page-actions">
                    <a class="btn-secondary" href="/recepcionista.html">Volver al panel</a>
                    <a class="btn-secondary" href="/logout">Cerrar sesión</a>
                </div>
            </div>

            <div class="table-panel card-small">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Cliente</th>
                            <th>Mascota</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="recep-recepcion-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="/js/page-actions.js" defer></script>
</body>
</html>
