<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tratamientos - Veterinario</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="veterinario-tratamientos">
    <div class="action-layout">
        <div class="action-frame">
            <div class="page-header">
                <div>
                    <h1>Tratamientos</h1>
                    <p class="page-description">Registra nuevos tratamientos y actualiza el seguimiento de mascotas en consulta.</p>
                </div>
                <div class="page-actions">
                    <a class="btn-secondary" href="/veterinario.html">Volver al panel</a>
                    <a class="btn-secondary" href="/logout">Cerrar sesión</a>
                </div>
            </div>

            <div class="form-panel card-small">
                <form id="vet-treatment-form">
                    <label for="tratamiento-historial">Seleccionar historial</label>
                    <select id="tratamiento-historial"></select>

                    <label for="tratamiento-medicamento">Medicamento</label>
                    <select id="tratamiento-medicamento"></select>

                    <label for="tratamiento-descripcion">Descripción</label>
                    <textarea id="tratamiento-descripcion" placeholder="Ej: Aplicar antibiótico 2 veces al día" required></textarea>

                    <label for="tratamiento-dosis">Dosis</label>
                    <input id="tratamiento-dosis" type="text" placeholder="Ej: 1ml cada 12h" required />

                    <label for="tratamiento-fecha-inicio">Fecha inicio</label>
                    <input id="tratamiento-fecha-inicio" type="date" required />

                    <label for="tratamiento-fecha-fin">Fecha fin</label>
                    <input id="tratamiento-fecha-fin" type="date" required />

                    <button type="submit" class="btn-primary" style="margin-top: 24px; width: 100%;">Guardar tratamiento</button>
                </form>
            </div>
        </div>
    </div>
    <script src="/js/page-actions.js" defer></script>
</body>
</html>
