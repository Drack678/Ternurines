<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo - Administrador</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="admin-catalogo">
    <div class="action-layout">
        <div class="action-frame">
            <div class="page-header">
                <div>
                    <h1>Catálogo de Servicios</h1>
                    <p class="page-description">Administrar medicamentos, servicios y productos disponibles en la clínica.</p>
                </div>
                <div class="page-actions">
                    <a class="btn-secondary" href="/admin.html">Volver al panel</a>
                    <a class="btn-secondary" href="/logout">Cerrar sesión</a>
                </div>
            </div>

            <div class="table-panel card-small">
                <h2>Servicios disponibles</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                        </tr>
                    </thead>
                    <tbody id="admin-servicios-body"></tbody>
                </table>
            </div>

            <div class="table-panel card-small" style="margin-top: 24px;">
                <h2>Medicamentos</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Stock</th>
                            <th>Precio</th>
                        </tr>
                    </thead>
                    <tbody id="admin-medicamentos-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="/js/page-actions.js" defer></script>
</body>
</html>
