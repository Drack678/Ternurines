<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestionar Usuarios - Administrador</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="admin-gestionar-usuarios">
    <div class="action-layout">
        <div class="action-frame">
            <div class="page-header">
                <div>
                    <h1>Gestionar Usuarios</h1>
                    <p class="page-description">Editar, eliminar o revisar la lista de usuarios que tienen acceso al sistema.</p>
                </div>
                <div class="page-actions">
                    <a class="btn-secondary" href="/admin.html">Volver al panel</a>
                    <a class="btn-secondary" href="/logout">Cerrar sesión</a>
                </div>
            </div>

            <div class="table-panel card-small">
                <table>
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>ID</th>
                        </tr>
                    </thead>
                    <tbody id="admin-users-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="/js/page-actions.js" defer></script>
</body>
</html>
