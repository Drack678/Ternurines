<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Usuario - Administrador</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="admin-registrar-usuario">
    <div class="action-layout">
        <div class="action-frame">
            <div class="page-header">
                <div>
                    <h1>Registrar Usuario</h1>
                    <p class="page-description">Crear cuentas nuevas para personal con roles definidos en el sistema.</p>
                </div>
                <div class="page-actions">
                    <a class="btn-secondary" href="/admin.html">Volver al panel</a>
                    <a class="btn-secondary" href="/logout">Cerrar sesión</a>
                </div>
            </div>

            <div class="form-panel card-small">
                <form id="admin-user-form">
                    <label for="new-username">Nombre de usuario</label>
                    <input id="new-username" type="text" placeholder="Ej: admin2" required />

                    <label for="new-password">Contraseña</label>
                    <input id="new-password" type="password" placeholder="Ej: contraseña segura" required />

                    <label for="new-role">Rol</label>
                    <select id="new-role">
                        <option value="ADMIN">Administrador</option>
                        <option value="VETERINARIO">Veterinario</option>
                        <option value="RECEPCIONISTA">Recepcionista</option>
                    </select>

                    <button type="submit" class="btn-primary" style="margin-top: 24px; width: 100%;">Guardar usuario</button>
                </form>
            </div>
        </div>
    </div>
    <script src="/js/page-actions.js" defer></script>
</body>
</html>
