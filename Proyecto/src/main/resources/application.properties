spring.datasource.url=jdbc:postgresql://localhost:5432/Ternurines
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Docker Compose usa las variables por defecto definidas en docker-compose.yml.
# Si necesitas usar H2 localmente, reemplaza estas propiedades con la configuración H2.
